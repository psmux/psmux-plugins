# =============================================================================
# psmux-theme-warm-burnout - Warm Burnout Dark
# Style: Minimal Warm Contrast
# Active tab: warm amber highlight. Inactive: quiet low-contrast text.
# =============================================================================
#
# Palette:
#   base=#14120f text=#b4a89c accent=#ff8f40 session=#ffb454
#   border=#222018 active-border=#b8522e message=#1f1d17 mode=#f5c56e

set -g status-position bottom
set -g status-justify centre
set -g status-style "fg=#b4a89c,bg=#14120f"

set -g status-left " #S "
set -g status-left-length 20
set -g status-left-style "fg=#ffb454,bg=#14120f"

set -g status-right ""
set -g status-right-length 0

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=#14120f,bg=#ff8f40,bold"
set -g window-status-style "fg=#b4a89c,bg=#14120f"
set -g window-status-separator ""

set -g pane-border-style "fg=#222018"
set -g pane-active-border-style "fg=#b8522e"

set -g message-style "fg=#bfbdb6,bg=#1f1d17"
set -g message-command-style "fg=#bfbdb6,bg=#1f1d17"

set -g mode-style "fg=#1a1510,bg=#f5c56e"
set -g clock-mode-colour "#f5c56e"